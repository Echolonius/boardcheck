name: Publish MCP server
run-name: "Publish MCP server from ${{ github.ref_name }}"

# Manual only. Releases the version in server.json (it must match pyproject.toml,
# agent_market_signals/__init__.py, manifest.json and a CHANGELOG heading):
#   1. build    - packs the MCP Bundle (.mcpb) with the official MCPB CLI, then unpacks it
#                 and starts the server the way an MCP host would (the command in
#                 manifest.json) and checks it lists the tools in manifest.json. A broken
#                 server stops the run here, before anything is released or published.
#   2. release  - creates the GitHub Release v<version> with the bundle attached.
#   3. publish  - writes the bundle's URL and SHA-256 into server.json and publishes it to
#                 the official MCP Registry as io.github.Echolonius/boardcheck. Login uses
#                 GitHub OIDC, so no token or secret is needed.
# Each job gets only the permissions it needs.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke-test the bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      asset: ${{ steps.meta.outputs.asset }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      # Official MCPB CLI. The integrity value is the npm registry's dist.integrity for
      # this exact version. Change both together.
      MCPB_VERSION: 2.1.2
      MCPB_INTEGRITY: sha512-goRbBC8ySo7SWb7tRzr+tL6FxDc4JPTRCdgfD2omba7freofvjq5rom1lBnYHZHo6Mizs1jAHJeN53aZbDoy8A==
      # uv runs the bundle in the smoke test, as an MCP host would. The hash is the
      # uv-x86_64-unknown-linux-gnu.tar.gz.sha256 published with this release. Change both together.
      UV_VERSION: 0.13.5
      UV_SHA256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the version and the mcp requirement agree everywhere
        id: meta
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, re, sys, tomllib

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          with open("server.json", encoding="utf-8") as f:
              server = json.load(f)
          with open("manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          with open("pyproject.toml", "rb") as f:
              pyproject = tomllib.load(f)
          with open("agent_market_signals/__init__.py", encoding="utf-8") as f:
              init = f.read()
          with open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()

          version = server["version"]
          match = re.search(r'^__version__ = "([^"]+)"', init, re.M)
          found = {
              "server.json packages[0].version": server["packages"][0].get("version"),
              "manifest.json": manifest["version"],
              "pyproject.toml": pyproject["project"]["version"],
              "agent_market_signals/__init__.py": match.group(1) if match else None,
          }
          for where, value in found.items():
              if value != version:
                  fail(f"{where} says {value!r} but server.json says {version!r}")
          if not re.search(r"^## " + re.escape(version) + " ", changelog, re.M):
              fail(f"CHANGELOG.md has no '## {version} ' heading")

          # The bundle must install mcp with the same requirement as the pyproject extra.
          extra = pyproject["project"]["optional-dependencies"]["mcp"]
          args = manifest["server"]["mcp_config"]["args"]
          requirement = args[args.index("--with") + 1]
          if extra != [requirement]:
              fail(f"manifest.json installs {requirement!r} but the pyproject mcp extra is {extra!r}")

          asset = f"boardcheck-mcp-{version}.mcpb"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\nasset={asset}\n")
          print(f"Version {version}, asset {asset}, mcp requirement {requirement}")
          PY

      - name: Install the MCPB CLI (pinned, integrity-checked)
        run: |
          set -euo pipefail
          node --version
          mkdir -p "$RUNNER_TEMP/mcpb-cli"
          cd "$RUNNER_TEMP/mcpb-cli"
          echo '{"private": true}' > package.json
          tarball=$(npm pack "@anthropic-ai/mcpb@${MCPB_VERSION}" --silent)
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          if [ "$actual" != "$MCPB_INTEGRITY" ]; then
            echo "::error::$tarball integrity $actual does not match the pinned $MCPB_INTEGRITY"
            exit 1
          fi
          npm install --no-save --ignore-scripts --no-audit --no-fund "./$tarball"
          echo "$RUNNER_TEMP/mcpb-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pack the bundle
        id: pack
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle" dist
          # Only what the server needs: the manifest, the package and its metadata.
          cp manifest.json pyproject.toml README.md LICENSE "$bundle/"
          cp -R agent_market_signals "$bundle/"
          mcpb validate "$bundle/manifest.json"
          mcpb pack "$bundle" "dist/$ASSET"
          sha256=$(sha256sum "dist/$ASSET" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$ASSET SHA-256: $sha256"

      - name: Install uv (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=uv-x86_64-unknown-linux-gnu.tar.gz # ubuntu-latest runners are x86_64
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${archive}"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p uv-bin
          tar xzf "$archive" --strip-components=1 -C uv-bin
          rm -f "$archive"
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
          uv-bin/uv --version

      - name: Smoke test - unpack the bundle and start the server like an MCP host
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/unpacked"
          mcpb unpack "dist/$ASSET" "$unpacked"
          ls -la "$unpacked"
          # Run from an unrelated folder so nothing can be imported from the checkout.
          cd "$RUNNER_TEMP"
          timeout 600 python3 -I - "$unpacked" <<'PY'
          import json, os, queue, subprocess, sys, threading, time

          root = os.path.abspath(sys.argv[1])
          with open(os.path.join(root, "manifest.json"), encoding="utf-8") as f:
              manifest = json.load(f)
          config = manifest["server"]["mcp_config"]
          command = [config["command"]] + [a.replace("${__dirname}", root) for a in config.get("args", [])]
          env = dict(os.environ)
          env.update({k: v.replace("${__dirname}", root) for k, v in config.get("env", {}).items()})
          print("Starting:", " ".join(command), flush=True)
          proc = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                  env=env, text=True, encoding="utf-8")

          lines = queue.Queue()

          def pump():
              for line in proc.stdout:
                  lines.put(line)
              lines.put(None)

          threading.Thread(target=pump, daemon=True).start()

          def fail(message):
              print(f"::error::Smoke test failed: {message}", flush=True)
              proc.kill()
              sys.exit(1)

          def send(message):
              proc.stdin.write(json.dumps(message) + "\n")
              proc.stdin.flush()

          def result(request_id, timeout=300):
              deadline = time.monotonic() + timeout
              while True:
                  try:
                      line = lines.get(timeout=max(0.0, deadline - time.monotonic()))
                  except queue.Empty:
                      fail(f"no answer to request {request_id} within {timeout} s")
                  if line is None:
                      fail(f"server exited with code {proc.wait()} before answering request {request_id}")
                  if not line.strip():
                      continue
                  try:
                      message = json.loads(line)
                  except ValueError:
                      fail(f"server wrote a non-JSON line to stdout: {line.strip()[:200]}")
                  if message.get("id") == request_id:
                      if "error" in message:
                          fail(f"request {request_id} failed: {message['error']}")
                      return message["result"]

          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {},
              "clientInfo": {"name": "boardcheck-release-smoke-test", "version": "1"}}})
          info = result(1)
          print("Server:", info.get("serverInfo"), "protocol", info.get("protocolVersion"), flush=True)
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          tools = sorted(tool["name"] for tool in result(2)["tools"])
          expected = sorted(tool["name"] for tool in manifest["tools"])
          print("Tools:", ", ".join(tools), flush=True)
          if tools != expected:
              fail(f"server tools {tools} do not match manifest.json tools {expected}")
          proc.stdin.close()
          try:
              proc.wait(timeout=30)
          except subprocess.TimeoutExpired:
              proc.kill()
          print("Smoke test passed: the bundle starts and serves the tools in manifest.json.", flush=True)
          PY

      - name: Check server.json with the registry's validator (does not publish)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ASSET: ${{ steps.meta.outputs.asset }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ASSET}"
          jq --arg url "$url" --arg sha "$SHA256" \
            '.packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > "$RUNNER_TEMP/server.json"
          curl --fail --silent --show-error -X POST -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/server.json" \
            https://registry.modelcontextprotocol.io/v0/validate > "$RUNNER_TEMP/validate.json"
          jq . "$RUNNER_TEMP/validate.json"
          jq -e '.valid == true' "$RUNNER_TEMP/validate.json" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: dist/${{ steps.meta.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release, upload the bundle
    outputs:
      asset_url: ${{ steps.release.outputs.asset_url }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ASSET: ${{ needs.build.outputs.asset }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: dist

      - name: Create release v${{ needs.build.outputs.version }} with the bundle attached
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          echo "$SHA256  dist/$ASSET" | sha256sum --check --strict
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "::error::Tag $tag already exists; bump the version before releasing again."
            exit 1
          fi
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { on = 1; next } on && /^## / { exit } on { print }' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          printf '\nMCP Bundle: `%s` (SHA-256 `%s`)\n' "$ASSET" "$SHA256" >> "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "dist/$ASSET" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq ".assets[] | select(.name == \"$ASSET\") | .browser_download_url")
          expected="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$ASSET"
          if [ "$url" != "$expected" ]; then
            echo "::error::Release asset URL is '$url', expected '$expected'"
            exit 1
          fi
          echo "asset_url=$url" >> "$GITHUB_OUTPUT"
          echo "Released $url"

  publish:
    name: Publish to the MCP Registry
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry (io.github.Echolonius namespace)
    env:
      # Pinned mcp-publisher release and checksum (the linux_amd64 line of that release's
      # registry_1.8.7_checksums.txt). Change both together.
      MCP_PUBLISHER_VERSION: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
      ASSET_URL: ${{ needs.release.outputs.asset_url }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=mcp-publisher_linux_amd64.tar.gz # ubuntu-latest runners are x86_64
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" mcp-publisher
          rm -f "$archive"

      - name: Write the release asset URL and its SHA-256 into server.json
        run: |
          set -euo pipefail
          # The hash must match what users will actually download.
          actual=$(curl --fail --location --silent --show-error "$ASSET_URL" | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$SHA256" ]; then
            echo "::error::$ASSET_URL has SHA-256 $actual, expected $SHA256"
            exit 1
          fi
          jq --arg url "$ASSET_URL" --arg sha "$SHA256" \
            '.packages[0].identifier = $url | .packages[0].fileSha256 = $sha' \
            server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json
          cat server.json

      - name: Validate
        run: |
          "$RUNNER_TEMP/mcp-publisher" validate

      - name: Login (GitHub OIDC)
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc

      - name: Publish
        run: |
          "$RUNNER_TEMP/mcp-publisher" publish
